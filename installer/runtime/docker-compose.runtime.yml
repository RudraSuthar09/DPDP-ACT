# The CUSTOMER-FACING compose file — what actually ships inside
# DPDP-Platform-Setup.exe and runs on the customer's machine.
#
# ARCHITECTURE (corrected): there is exactly ONE DPDP database — the
# existing central control-plane PostgreSQL, shared across every tenant
# (SaaS and Enterprise alike) via the existing RLS architecture. This
# compose file does NOT create, start, or depend on any local Postgres —
# there is no `postgres` service and no `migrate` service here. Every
# service below connects outbound to the central database via
# APP_DATABASE_URL (see ../config/.env, generated by generate-env.ps1),
# exactly the way every developer's own local `pnpm dev:api` already does.
# Database migrations are a provider-side operation against the central
# database — never something a customer installation runs.
#
# For an Enterprise one-PC test, "the customer's private database" is a
# SEPARATE Postgres instance the tester points the Gateway agent's own
# connector configuration at (see the Gateway/data-sources setup in the
# app itself) — it is not provisioned by this installer, and must never be
# confused with the central database above.
#
# Deliberately different from the repo-root docker-compose.yml (the dev
# file, untouched by this phase):
#   - NO `build:` sections anywhere. Every image is pre-built and shipped as
#     a `docker load`-able tar (see installer/scripts/package-images.ps1) —
#     the customer never needs pnpm/node/git/the source tree.
#   - No explicit `container_name:` on any service — this file is always
#     run under its own Compose project name (`-p dpdp`, see the install/
#     start scripts) so it can coexist with a developer's own `docker
#     compose up` from the repo root without name collisions.
#   - `frontend` uses the `dpdp-frontend:installer` image variant, built
#     with NEXT_PUBLIC_REQUIRE_ACTIVATION=true baked in at build time — the
#     ONLY thing that turns on the first-run activation gate. The default
#     `dpdp-frontend:local` dev image is untouched and never shows it.
#
# Invoked as:
#   docker compose -p dpdp -f runtime\docker-compose.runtime.yml <cmd>
# from the install root, so `env_file: ../config/.env` (relative to THIS
# file, not the caller's cwd) resolves to <install-root>\config\.env.

services:
  backend:
    image: dpdp-backend:local
    env_file: ../config/.env
    ports:
      - '${API_PORT:-3001}:3001'
    networks: [dpdp-net]
    restart: unless-stopped

  worker:
    image: dpdp-backend:local
    command: ['node', 'dist/worker.js']
    env_file: ../config/.env
    healthcheck:
      disable: true
    networks: [dpdp-net]
    restart: unless-stopped

  frontend:
    image: dpdp-frontend:installer
    environment:
      NODE_ENV: production
      # Server-rendered public pages (forms/[slug], portal/[slug]) run INSIDE
      # this container — "localhost:3001" there means this container, not
      # the backend's. See frontend/src/lib/api.ts's SERVER_API_URL.
      INTERNAL_API_URL: http://backend:3001
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks: [dpdp-net]
    restart: unless-stopped

  agent:
    image: dpdp-agent:local
    environment:
      GATEWAY_BIND_HOST: 0.0.0.0
      GATEWAY_BIND_PORT: ${GATEWAY_BIND_PORT:-7071}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost:3000}
      # The backend's CONTAINER-NETWORK address (dpdp-net) — agent and
      # backend are separate containers here too, never localhost.
      GATEWAY_CONTROL_PLANE_URL: ${GATEWAY_CONTROL_PLANE_URL:-http://backend:3001}
      # Where the agent persists its enrollment device credential between
      # restarts — backed by the named volume below, so it survives
      # `docker compose down` + `up` but not `down -v` (which correctly
      # forces re-enrollment). See agent/src/enrollment.ts.
      GATEWAY_STATE_DIR: /app/state
      # The one-time enrollment code — ONLY needed on the run that first
      # enrolls this Gateway. Never written to config\.env or baked into any
      # image; start.ps1's -GatewayEnrollmentCode sets it as a transient
      # process env var for the one `docker compose up` call that needs it.
      GATEWAY_ENROLLMENT_CODE: ${GATEWAY_ENROLLMENT_CODE:-}
      GATEWAY_DISPLAY_NAME: ${GATEWAY_DISPLAY_NAME:-DPDP Gateway}
      GATEWAY_HEARTBEAT_INTERVAL_SECONDS: ${GATEWAY_HEARTBEAT_INTERVAL_SECONDS:-60}
      # Storage Data-Plane: same mechanism as GATEWAY_SOURCES, applied to
      # storage roots (see the repo-root docker-compose.yml's matching
      # comment and docs/environment-variables.md). Left empty until an
      # Enterprise storage root is configured in DPDP and its id is known —
      # set as a transient env var for the one `docker compose up` call that
      # needs it, same as GATEWAY_ENROLLMENT_CODE:
      #   $env:GATEWAY_STORAGE_ROOTS = '[{"storageRootId":"<uuid-from-DPDP-UI>","rootPath":"/client-storage"}]'
      GATEWAY_STORAGE_ROOTS: ${GATEWAY_STORAGE_ROOTS:-}
    volumes:
      - gateway_state:/app/state
      # A REAL host directory, bound to the FIXED container path
      # /client-storage — never a Docker volume, so the customer's own files
      # stay visible/manageable on their own machine. Defaults to a folder
      # under the install root (auto-created by Docker if missing) so a
      # fresh install never fails just because Enterprise storage hasn't
      # been configured yet; override GATEWAY_STORAGE_HOST_DIR in
      # config\.env to point at wherever the customer wants it (e.g. a
      # dedicated data drive) — never the install root itself, never an
      # arbitrary existing folder with unrelated files in it.
      - ${GATEWAY_STORAGE_HOST_DIR:-../data/gateway-storage}:/client-storage
    ports:
      - '${GATEWAY_BIND_PORT:-7071}:7071'
    networks: [dpdp-net]
    restart: unless-stopped

networks:
  dpdp-net:
    driver: bridge

volumes:
  # The Gateway/Agent's persisted enrollment device credential. Deliberately
  # the only volume this runtime declares — there is still no local Postgres
  # (see the header comment above); this is a local bearer credential, not a
  # database. `docker compose down` (no -v) preserves it across reinstalls/
  # restarts; `down -v` removes it and correctly forces re-enrollment.
  gateway_state:
