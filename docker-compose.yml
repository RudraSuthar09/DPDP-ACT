  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   command: ['node', 'dist/main.js']
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-dpdp}:${POSTGRES_PASSWORD:-dpdp_local_dev_only}@postgres:5432/${POSTGRES_DB:-dpdp}
  #     REDIS_URL: redis://redis:6379
  #     API_PORT: 3001
  #   ports:
  #     - '3001:3001'
  #
  # worker:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   command: ['node', 'dist/worker.js']
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-dpdp}:${POSTGRES_PASSWORD:-dpdp_local_dev_only}@postgres:5432/${POSTGRES_DB:-dpdp}
  #     REDIS_URL: redis://redis:6379

volumes:
  dpdp_pgdata:
  dpdp_redisdata:
