# DPDP Platform — local development Docker Compose (locked architecture §13/§14).
#
# Default profile (no --profile flag): backend + worker + frontend + agent,
# all pointed at whatever DATABASE_URL/APP_DATABASE_URL is in `.env` — today
# that is the hosted Supabase dev instance (see .env's POSTGRES_HOST). This is
# deliberate: dev already works against Supabase, and this Compose file does
# not blindly replace that with a container (per §14's own guidance).
#
# Optional `local-db` profile: a real local Postgres 16 container, for fully
# offline/CI-style development. Enabling it does NOT automatically rewire
# backend/worker — see docs/environment-variables.md for how to point
# DATABASE_URL/APP_DATABASE_URL at it (the roles it needs are created
# idempotently by the existing bootstrap migration, same as
# scripts/local-db.mjs's embedded-postgres path).
#
# No Kubernetes here (§13) and no cloud-provider-specific config (§17) — this
# is plain Compose so it stays portable to ECS/App Runner/Container Apps/AKS
# later without rewriting anything here.
#
# Storage Data-Plane (Enterprise Gateway <-> real host filesystem): the
# `agent` service bind-mounts ONE dedicated host directory
# (GATEWAY_STORAGE_HOST_DIR, default `E:\DPDP-Test-Storage` for local
# Windows testing) to the FIXED container path `/client-storage`. Never the
# repo, never a whole drive, never an arbitrary user folder — only that one
# directory. GATEWAY_STORAGE_ROOTS then tells the agent which DPDP storage
# root id maps to that container path (see the `agent` service's own
# comment, and docs/environment-variables.md). Central PostgreSQL never
# receives file contents; the real files/folders live ONLY on this host
# directory, never in a Docker volume.
#
# Secrets: nothing is hardcoded in this file. backend/worker read `.env`
# (gitignored, never committed) via `env_file` — they're the services that
# actually need APP_DATABASE_URL/JWT_SECRET/etc. `frontend` and `agent` get
# only the specific, non-secret variables they each need, listed explicitly
# below (least privilege — see each service's own comment). The optional
# `postgres` service requires POSTGRES_PASSWORD from `.env` and refuses to
# start without it, rather than falling back to a value written here.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: dpdp-backend:local
    container_name: dpdp-backend
    # LOCAL ONLY: runs as root, although the image itself runs as the
    # unprivileged `node` user. Docker Desktop presents the Windows folder
    # bind-mounted below through a 9p mount fixed at uid 0 / mode 755, so only
    # root can write into it — the Enterprise 'server' storage feature fails
    # otherwise. Production does not mount a host folder and keeps the image's
    # non-root default; so does installer/runtime/docker-compose.runtime.yml.
    user: root
    env_file: .env
    environment:
      NODE_ENV: development
    ports:
      - '${API_PORT:-3001}:3001'
    # Central DPDP Storage automatic sync — Enterprise 'server' provider. A
    # dedicated host directory bind-mounted to a FIXED container path, same
    # discipline as the agent's GATEWAY_STORAGE_HOST_DIR->/client-storage
    # mount below: never the repo, never a whole drive. The API process needs
    # this so ConsentFormsService.submit() can write field values SYNCHRONOUSLY
    # at submission time (see EnterpriseStorageSyncService); the worker (below)
    # needs the SAME mount for its periodic catch-up sweep. Configuring a
    # 'server' storage root in the UI means entering the CONTAINER path
    # (/enterprise-storage) here, not the host path — the bind mount is what
    # makes ENTERPRISE_STORAGE_HOST_DIR appear there.
    volumes:
      - ${ENTERPRISE_STORAGE_HOST_DIR:-E:\DPDP-Enterprise-Test}:/enterprise-storage
    networks:
      - dpdp-net
    restart: unless-stopped
    # Time for Nest's shutdown hooks after SIGTERM (in-flight requests finish,
    # pg-boss stops gracefully, pools close) before Docker force-kills. The
    # 10s default cut that short. Mirror this as the ECS stopTimeout.
    stop_grace_period: 30s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: dpdp-backend:local
    container_name: dpdp-worker
    # LOCAL ONLY — same reason as backend: the Windows bind mount below.
    user: root
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      NODE_ENV: development
    # No ports: the worker has no HTTP listener (pg-boss job consumer only)
    # and no HEALTHCHECK for the same reason (the image's HEALTHCHECK probes
    # an HTTP port the worker never opens).
    healthcheck:
      disable: true
    # Same Enterprise Central DPDP Storage mount as backend, above — the
    # periodic catch-up sweep (EnterpriseStorageSyncWorker) runs here and
    # needs the identical container path to reach the identical host directory.
    volumes:
      - ${ENTERPRISE_STORAGE_HOST_DIR:-E:\DPDP-Enterprise-Test}:/enterprise-storage
    networks:
      - dpdp-net
    restart: unless-stopped
    # A pg-boss job in flight gets to finish. See backend's stop_grace_period.
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    image: dpdp-frontend:local
    container_name: dpdp-frontend
    # No env_file here, deliberately: the frontend is a static Next.js server
    # with no legitimate use for anything in .env at runtime (its one real
    # config value, NEXT_PUBLIC_API_URL, is baked in at BUILD time via the
    # arg above). Least privilege — it never sees APP_DATABASE_URL, JWT_SECRET,
    # or any other backend secret.
    environment:
      NODE_ENV: production
      # Server-rendered public pages (forms/[slug], portal/[slug]) run INSIDE
      # this container and cannot reach the backend at "localhost:3001" (that
      # would mean this container, not the backend's) — they need the
      # container-network address instead. See frontend/src/lib/api.ts's
      # SERVER_API_URL. Never NEXT_PUBLIC_-prefixed: this is a server-only
      # runtime value, not baked into the browser bundle.
      INTERNAL_API_URL: http://backend:3001
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dpdp-net
    restart: unless-stopped

  # The Gateway/Agent process (locked architecture §5). Runs as a SEPARATE
  # process here too — never merged into the backend container — matching
  # how it already runs outside Docker. GATEWAY_BIND_HOST is explicitly set
  # to 0.0.0.0 so other containers/the host browser can reach it; the agent
  # itself detects this and logs its existing non-loopback warning (nothing
  # about that behavior changes for Docker).
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: dpdp-agent:local
    container_name: dpdp-agent
    environment:
      GATEWAY_BIND_HOST: 0.0.0.0
      GATEWAY_BIND_PORT: ${GATEWAY_BIND_PORT:-7071}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost:3000}
      # The backend's CONTAINER-NETWORK address (dpdp-net), never localhost —
      # agent and backend are separate containers. Overridable for a dev
      # setup where the backend runs outside Docker instead.
      GATEWAY_CONTROL_PLANE_URL: ${GATEWAY_CONTROL_PLANE_URL:-http://backend:3001}
      # Keep agent -> backend traffic on the container network. The agent
      # honours HTTP(S)_PROXY / NO_PROXY (agent/README.md, "Outbound
      # connections"), and the Docker CLI injects those into containers when a
      # proxy is set in ~/.docker/config.json; the backend's container name
      # would not normally be in that NO_PROXY, so the agent would send it to
      # the external proxy. GATEWAY_NO_PROXY is ADDED to whatever NO_PROXY the
      # container has (never replaces it), so NO_PROXY / HTTP(S)_PROXY are
      # deliberately not set here: Docker's or the customer's values apply
      # unchanged to every other destination.
      GATEWAY_NO_PROXY: backend
      # Where the agent persists its enrollment device credential between
      # restarts — backed by the named volume below so it survives
      # `docker compose down` + `up` (but not `down -v`, which removes it and
      # correctly forces re-enrollment). See agent/src/enrollment.ts.
      GATEWAY_STATE_DIR: /app/state
      # The one-time enrollment code — ONLY needed on the run that first
      # enrolls this Gateway (no persisted credential yet in the volume
      # below). Never baked into this file or config/.env; set it as a
      # transient shell env var for that one `docker compose up` call, e.g.:
      #   $env:GATEWAY_ENROLLMENT_CODE = '<code>'; docker compose up -d agent
      GATEWAY_ENROLLMENT_CODE: ${GATEWAY_ENROLLMENT_CODE:-}
      GATEWAY_DISPLAY_NAME: ${GATEWAY_DISPLAY_NAME:-DPDP Gateway}
      GATEWAY_HEARTBEAT_INTERVAL_SECONDS: ${GATEWAY_HEARTBEAT_INTERVAL_SECONDS:-60}
      # Storage data-plane (agent/src/storage/registry.ts's loadStorageRootConfig)
      # — the SAME config mechanism GATEWAY_SOURCES already uses, applied to
      # storage roots instead of data sources. A JSON array of
      # { storageRootId, rootPath } — storageRootId comes from DPDP's own
      # "Storage Management" screen (POST /storage/roots created it centrally;
      # you cannot know it ahead of time), rootPath is the path INSIDE this
      # container (below, always /client-storage — never the host path). Left
      # empty by default (no storage root configured, exactly like
      # GATEWAY_SOURCES): set it as a transient shell env var for the run that
      # needs it, same pattern as GATEWAY_ENROLLMENT_CODE, e.g.:
      #   $env:GATEWAY_STORAGE_ROOTS = '[{"storageRootId":"<uuid-from-DPDP-UI>","rootPath":"/client-storage"}]'
      #   docker compose up -d agent
      GATEWAY_STORAGE_ROOTS: ${GATEWAY_STORAGE_ROOTS:-}
      # Submission delivery queue poller (agent/src/delivery) — the client
      # half of the cloud relay for a hosted-link submission's field values/
      # documents. Distinct from the Storage Data-Plane above (GATEWAY_
      # STORAGE_ROOTS/client-storage): that is per-storageRootId folder
      # browsing; this is the SINGLE local root the poller writes a
      # submission's Customer Information/Consent Register files into,
      # exactly mirroring Central DPDP Storage's structure. In a REAL
      # (non-Docker) deployment, co-located with the installed Electron app,
      # set ELECTRON_STORAGE_CONFIG_PATH instead (read directly, takes
      # precedence) — see agent/src/delivery/local-root.ts. Left as the
      # in-container path below for this Docker local-cloud-simulation test.
      AGENT_LOCAL_STORAGE_ROOT: /delivery-storage
      AGENT_DELIVERY_POLL_INTERVAL_SECONDS: ${AGENT_DELIVERY_POLL_INTERVAL_SECONDS:-10}
    volumes:
      - dpdp_gateway_state:/app/state
      # The dedicated Windows host test directory for the Storage Data-Plane,
      # bound to the FIXED in-container path /client-storage (never baked into
      # agent source — see gateway-storage-provider.ts, which only ever reads
      # whatever rootPath GATEWAY_STORAGE_ROOTS gives it). Configurable via
      # GATEWAY_STORAGE_HOST_DIR; defaults to a dedicated local test directory
      # — NEVER the repo, NEVER a whole drive, NEVER an arbitrary user folder.
      # Anything the Gateway creates under /client-storage physically appears
      # here; anything outside it is unreachable (path-safety.ts's
      # resolveContainedDir still enforces containment INSIDE this mount).
      - ${GATEWAY_STORAGE_HOST_DIR:-E:\DPDP-Test-Storage}:/client-storage
      # The submission delivery poller's local root (see AGENT_LOCAL_STORAGE_
      # ROOT above) — for the acceptance test in this task, point this at the
      # SAME folder Electron was configured with, e.g.:
      #   $env:AGENT_DELIVERY_HOST_DIR = 'D:\Enterprise testing old'
      #   docker compose up -d --build agent
      - ${AGENT_DELIVERY_HOST_DIR:-E:\DPDP-Delivery-Test}:/delivery-storage
    ports:
      - '${GATEWAY_BIND_PORT:-7071}:7071'
    networks:
      - dpdp-net
    restart: unless-stopped

  # Optional local Postgres — enable with: docker compose --profile local-db up postgres
  postgres:
    image: postgres:16
    container_name: dpdp-postgres
    profiles: ['local-db']
    environment:
      # USER/DB are names, not credentials — a harmless default is fine.
      # PASSWORD is a real credential: no literal fallback lives in this file.
      # Compose fails fast with a clear error if .env doesn't set it, rather
      # than silently starting Postgres with a password baked into this repo.
      POSTGRES_USER: ${POSTGRES_USER:-dpdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before using the local-db profile}
      POSTGRES_DB: ${POSTGRES_DB:-dpdp}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - dpdp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dpdp} -d ${POSTGRES_DB:-dpdp}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dpdp-net
    restart: unless-stopped

networks:
  dpdp-net:
    driver: bridge

volumes:
  dpdp_pgdata:
  # The Gateway/Agent's persisted enrollment device credential (Phase 1 —
  # agent/src/enrollment.ts). Deliberately its own volume, separate from
  # dpdp_pgdata: it holds a local bearer credential, never a database, and
  # must survive independently of whether the optional local-db profile is
  # ever used.
  dpdp_gateway_state:
