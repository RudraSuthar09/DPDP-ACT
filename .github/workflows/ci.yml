name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build · Lint · Test
    runs-on: ubuntu-latest

    # Postgres + Redis so tests (and, next, the cross-tenant isolation suite)
    # have real infrastructure to run against.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dpdp
          POSTGRES_PASSWORD: dpdp_ci
          POSTGRES_DB: dpdp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dpdp -d dpdp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Owner/admin connection — migrations (DDL) only.
      DATABASE_URL: postgresql://dpdp:dpdp_ci@localhost:5432/dpdp_test
      # Runtime connection — the least-privilege, RLS-enforced role the migrations
      # create (dpdp_app). The isolation suite connects as this.
      APP_DATABASE_URL: postgresql://dpdp_app:dpdp_app_local_dev_only@localhost:5432/dpdp_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run migrations
        run: pnpm --filter @dpdp/api exec node-pg-migrate up

      - name: Test
        run: pnpm test

      # The cross-tenant isolation suite (NFR-SEC-05, rule R5) — runs on every PR
      # and MUST stay green. Connects as dpdp_app (APP_DATABASE_URL) and fails
      # loudly if any query returns another tenant's rows.
      - name: Cross-tenant isolation suite
        run: pnpm --filter @dpdp/api run test:isolation
