<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>DPDP Platform</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0f172a; color: #e2e8f0;
    font-family: Segoe UI, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-app-region: drag;
  }
  .card { text-align: center; padding: 24px; max-width: 380px; }
  .brand { font-size: 20px; font-weight: 600; margin-bottom: 18px; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 16px;
    border: 3px solid rgba(226,232,240,0.25);
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .spinner.hidden { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 13px; color: #94a3b8; min-height: 36px; white-space: pre-wrap; }
  .status.error { color: #fca5a5; }
  .quit {
    -webkit-app-region: no-drag;
    margin-top: 14px; display: none;
    background: transparent; color: #cbd5e1; border: 1px solid #475569;
    border-radius: 4px; padding: 6px 14px; font-size: 12px; cursor: pointer;
  }
  .quit.visible { display: inline-block; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">DPDP Platform</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Starting...</div>
    <button class="quit" id="quit">Close</button>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const quitEl = document.getElementById('quit');
    window.dpdpSplash.onStatus((text) => {
      statusEl.textContent = text;
      statusEl.classList.remove('error');
    });
    window.dpdpSplash.onError((text) => {
      statusEl.textContent = text;
      statusEl.classList.add('error');
      spinnerEl.classList.add('hidden');
      quitEl.classList.add('visible');
    });
    quitEl.addEventListener('click', () => window.close());
  </script>
</body>
</html>
